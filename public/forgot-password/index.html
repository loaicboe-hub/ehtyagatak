<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسيت كلمة المرور؟ — شركة احتياجاتك للتنمية المستدامة</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/foundation/design-system/tokens.css">
  <link rel="stylesheet" href="/foundation/design-system/base.css">
  <link rel="stylesheet" href="/foundation/design-system/components.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card card stack">
      <div class="cluster" style="justify-content: space-between;">
        <a href="/ar">
          <img src="/assets/logo.png" alt="شركة احتياجاتك للتنمية المستدامة" style="block-size: 5.2rem; inline-size: auto;">
        </a>
        <a class="btn btn--ghost btn--sm" href="/login?lang=en">English</a>
      </div>
      
      <h1 style="font-size: var(--text-2xl); margin: 0;">نسيت كلمة المرور؟</h1>
      <p class="card__subtitle" style="margin: 0;">أدخل بريدك الإلكتروني المسجل لاستلام رابط إعادة تعيين كلمة المرور.</p>
      
      
      <form class="form-grid" method="post" action="/api/auth/forgot-password">
        <input type="hidden" name="_csrf" value="1795705099.lHQaqll5VVTNKNGGw7X-QQ.4xBQDnLWvpifumIRX7pN73haxmq23qcyA6Qquv5etw4">
        <input type="hidden" name="lang" value="ar">
        <div class="form-field">
          <label class="form-label" for="fp-email">البريد الإلكتروني</label>
          <input class="form-control" id="fp-email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn--primary" type="submit">إرسال رابط الاستعادة</button>
      </form>
      <a href="/login" style="font-size: var(--text-sm);">العودة لتسجيل الدخول</a>
    
      <div class="cluster" style="justify-content: space-between; font-size: var(--text-xs);">
        <a href="/ar">&larr; العودة للرئيسية</a>
        <span>شركة احتياجاتك للتنمية المستدامة</span>
      </div>
    </div>
  </main>
</body>
</html>
