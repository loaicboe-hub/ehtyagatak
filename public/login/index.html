<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — شركة احتياجاتك للتنمية المستدامة</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/foundation/design-system/tokens.css">
  <link rel="stylesheet" href="/foundation/design-system/base.css">
  <link rel="stylesheet" href="/foundation/design-system/components.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card card stack">
      <div class="cluster" style="justify-content: space-between;">
        <a href="/ar">
          <img src="/assets/logo.png" alt="شركة احتياجاتك للتنمية المستدامة" style="block-size: 5.2rem; inline-size: auto;">
        </a>
        <a class="btn btn--ghost btn--sm" href="/login?lang=en">English</a>
      </div>
      
      <h1 style="font-size: var(--text-2xl); margin: 0;">تسجيل الدخول</h1>
      <p class="card__subtitle" style="margin: 0;">دخول المستثمرين وفريق الإدارة إلى حساباتهم المعتمدة.</p>
      
      
      <form class="form-grid" method="post" action="/api/auth/login">
        <input type="hidden" name="_csrf" value="1795706885.OsVKrTXkuQGNbGCpGJn9ng.QUqv0mR4Gxt5lOlVYBytHUXS99csctbGXv1FIPl5KMw">
        <input type="hidden" name="lang" value="ar">
        <div class="form-field">
          <label class="form-label" for="login-email">البريد الإلكتروني</label>
          <input class="form-control" id="login-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="login-password">كلمة المرور</label>
          <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <label class="cluster" style="font-size: var(--text-sm);">
          <input type="checkbox" name="remember_me" value="1">
          <span>تذكرني</span>
        </label>
        <button class="btn btn--primary" type="submit">دخول</button>
      </form>
      <div class="cluster" style="justify-content: space-between; font-size: var(--text-sm);">
        <a href="/forgot-password">نسيت كلمة المرور؟</a>
      </div>
      <p class="form-hint" style="margin: 0;">التسجيل الذاتي غير متاح؛ يتم إنشاء حسابات المستثمرين حصرياً عبر إدارة الشركة.</p>
    
      <div class="cluster" style="justify-content: space-between; font-size: var(--text-xs);">
        <a href="/ar">&larr; العودة للرئيسية</a>
        <span>شركة احتياجاتك للتنمية المستدامة</span>
      </div>
    </div>
  </main>
</body>
</html>
